[package]
name = "slime-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
slime-converter = { path = "../slime-converter" }
slime-core = { path = "../slime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
slime-neural = { path = "../slime-neural", optional = true }

[features]
# Neural N-best rescoring experiments (Phase 2). Requires cmake to build
# llama.cpp; keep optional so default builds stay pure Rust.
neural = ["dep:slime-neural"]

[dev-dependencies]
ed25519-dalek = { version = "3.0", default-features = false, features = ["signature"] }

[lints]
workspace = true

[[bin]]
name = "slime-evaluate"
path = "src/main.rs"

[[bin]]
name = "slime-devset"
path = "src/devset.rs"

[[bin]]
name = "slime-balanced-devset"
path = "src/balanced_devset.rs"

[[bin]]
name = "slime-dictionary-pack"
path = "src/dictionary_pack.rs"

[[bin]]
name = "slime-dictionary-coverage"
path = "src/dictionary_coverage.rs"

[[bin]]
name = "slime-recall"
path = "src/recall.rs"

[[bin]]
name = "slime-text-corpus"
path = "src/text_corpus.rs"

[[bin]]
name = "slime-recall-corpus"
path = "src/recall_corpus.rs"

[[bin]]
name = "slime-typo-evaluate"
path = "src/typo_evaluation.rs"

[[bin]]
name = "slime-context-pack-evaluate"
path = "src/context_pack_evaluation.rs"

[[bin]]
name = "slime-context-rules"
path = "src/context_rule_generation.rs"

[[bin]]
name = "slime-term-dictionary"
path = "src/term_dictionary_generation.rs"

[[bin]]
name = "slime-pack-startup-evaluate"
path = "src/pack_startup_evaluation.rs"

[[bin]]
name = "neural_prefix_probe"
path = "src/bin/neural_prefix_probe.rs"
required-features = ["neural"]
